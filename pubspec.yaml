name: _
repository: https://github.com/adario/rasterizer_flutter
workspace:
  - flame_rasterizer
  - flame_rasterizer/benchmark
  - flame_rasterizer/example
  - rasterizer_gpu
  - rasterizer_gpu/example

environment:
  sdk: ^3.13.7

dev_dependencies:
  melos: ^8.9.0

# Flame's main, for every package in the workspace, which flame_rasterizer
# asks for as flame ^2.0.0-dev.1, with its lints, flame_lint ^1.5.0-dev.1, and
# flame_forge2d for the example. Remove these once flame 2.0, flame_lint 1.5,
# flame_forge2d 0.21 and flame_svg 3.0 are on pub.dev.
dependency_overrides:
  flame:
    git:
      url: https://github.com/flame-engine/flame
      path: packages/flame
      ref: main
  flame_forge2d:
    git:
      url: https://github.com/flame-engine/flame
      path: packages/flame_forge2d
      ref: main
  flame_lint:
    git:
      url: https://github.com/flame-engine/flame
      path: packages/flame_lint
      ref: main
  flame_svg:
    git:
      url: https://github.com/flame-engine/flame
      path: packages/flame_svg
      ref: main

melos:
  scripts:
    lint:all:
      steps:
        - melos analyze
        - format
      description: Run all static analysis checks.

    format-check:
      run: melos exec dart format . --set-exit-if-changed
      description: Run `dart format` checks for all packages.
